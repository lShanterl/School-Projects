    <style>
.cinema-hall {
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
}

h2 {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 20px;
}

.screen {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
}

table {
  border-collapse: collapse;
  margin: 0 auto;
}

td {
  padding: 10px;
}

input[type="checkbox"] {
  display: none;
}

label {
  display: block;
  height: 25px;
  width: 25px;
  border: 1px solid #ccc;
  margin: 5px;
  cursor: pointer;
  position: relative;
}

label::before {
  content: "";
  display: block;
  height: 100%;
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
}
label::after {
  content: attr(data-seat-number);
  display: block;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  color: #000;
  pointer-events: none;
}

input[type="checkbox"]:checked + label::before {
  background-color: #ff0;
}

button[type="submit"] {
  display: block;
  margin: 20px auto 0;
  padding: 10px 20px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  background-color: #007bff;
  color: #fff;
  cursor: pointer;
}

button[type="submit"]:hover {
  background-color: #0062cc;
}
    </style>
</head>
