<!DOCTYPE html>
<html>
<head>
	<title>Cinema Seat Reservation</title>
	<style>
		.container {
			max-width: 800px;
			margin: 0 auto;
			padding: 20px;
		}

		.row {
			display: flex;
			flex-wrap: wrap;
			margin: 10px 0;
		}

		.seat {
			width: 30px;
			height: 30px;
			margin: 5px;
			background-color: #eee;
			border-radius: 5px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
		}

		.seat-checkbox {
			display: none;
		}

		.seat-checkbox:checked + .seat {
			background-color: #90ee90;
			cursor: not-allowed;
		}

		.seat-label {
			margin-left: 5px;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Cinema Seat Reservation</h1>
		<form>
			<div class="row">
				<input type="checkbox" id="A1" class="seat-checkbox" />
				<label for="A1" class="seat"><span class="seat-label">A1</span></label>
				<input type="checkbox" id="A2" class="seat-checkbox" />
				<label for="A2" class="seat"><span class="seat-label">A2</span></label>
				<input type="checkbox" id="A3" class="seat-checkbox" />
				<label for="A3" class="seat"><span class="seat-label">A3</span></label>
				<input type="checkbox" id="A4" class="seat-checkbox" />
				<label for="A4" class="seat"><span class="seat-label">A4</span></label>
				<input type="checkbox" id="A5" class="seat-checkbox" />
				<label for="A5" class="seat"><span class="seat-label">A5</span></label>
			</div>
			<div class="row">
				<input type="checkbox" id="B1" class="seat-checkbox" />
				<label for="B1" class="seat"><span class="seat-label">B1</span></label>
				<input type="checkbox" id="B2" class="seat-checkbox" />
				<label for="B2" class="seat"><span class="seat-label">B2</span></label>
				<input type="checkbox" id="B3" class="seat-checkbox" />
				<label for="B3" class="seat"><span class="seat-label">B3</span></label>
				<input type="checkbox" id="B4" class="seat-checkbox" />
				<label for="B4" class="seat"><span class="seat-label">B4</span></label>
				<input type="checkbox" id="B5" class="seat-checkbox" />
				<label for="B5" class="seat"><span class="seat-label">B5</span></label>
			</div>
			<!-- add more rows here -->
		</form>
	</div>
</body>
</html>
